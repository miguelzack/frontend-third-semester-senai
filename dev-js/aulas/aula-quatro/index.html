<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1>Visualize o resultado pelo console</h1>
<script>
    let idade = prompt("Digite a sua idade")

    if (idade >= 1 & idade < 12) {
        console.log("Você é uma criança.")
    } else if (idade >= 12 & idade <= 17) {
        console.log("Você é um adoslecente.")
    } else if (idade >= 18 & idade <= 59) {
        console.log("Você é um adulto.")
    } else if (idade >= 60 & idade <= 120) {
        console.log("Você é um idoso.")
    } else {
        console.log("Você nem tá vivo, como tá acessando esse site?")
    }
</script>
</body>
</html>
